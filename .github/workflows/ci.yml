name: Validate extensions

on:
  push:
    branches: [main, "fix/**", "feat/**", "test/**"]
  pull_request:
    branches: [main, "fix/**", "feat/**", "test/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
            echo "Valid JSON: $file"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -not -path '*/node_modules/*' -print0)
      - name: Check JavaScript syntax
        run: |
          node --check vscode-2flow/extension.js
          node --check vscode-2flow/test/smoke-test.js
          node --check chrome-2flow/content.js
          node --check chrome-2flow/test/smoke-test.js
          node --check chrome-2flow/test/dom-regression-test.js
      - name: Test VS Code extension metadata and grammar
        run: node vscode-2flow/test/smoke-test.js
      - name: Test Chrome extension metadata and behavior guards
        run: node chrome-2flow/test/smoke-test.js
      - name: Test Chrome highlighter DOM behavior
        run: node chrome-2flow/test/dom-regression-test.js
      - name: Package VS Code extension
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: vscode-2flow
      - name: Package Chrome extension
        run: zip -j 2flow-dracula-chrome.zip chrome-2flow/manifest.json chrome-2flow/content.js chrome-2flow/styles.css chrome-2flow/README.md
      - name: Upload installable packages
        uses: actions/upload-artifact@v4
        with:
          name: 2flow-extensions-${{ github.sha }}
          if-no-files-found: error
          path: |
            vscode-2flow/*.vsix
            2flow-dracula-chrome.zip
          retention-days: 14
